<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAR Studios — Services</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo"><img src="icons/logowhitenobackground.png" alt="RAR Studios Logo"></div>
      <div class="logo-tagline"><span>Handmade jewellery</span><span>Based in Barcelona</span></div>
    </div>
    <!-- NAV -->
  </header>

  <main class="frosty-container page-top">
    <section id="custom" class="gallery">
      <h2>Custom</h2>
      <div class="gallery-grid">
        <img src="images/emeraldring.jpg" alt="Custom example">
        <img src="images/goldearring.jpg" alt="Custom example">
        <img src="images/opalring.jpg" alt="Custom example">
        <img src="images/vinering.jpg" alt="Custom example">
      </div>
    </section>

    <section id="repair" class="gallery">
      <h2>Repair</h2>
      <div class="gallery-grid">
        <img src="images/repairgold.jpg" alt="Repair example">
      </div>
    </section>
  </main>
</body>
</html>
