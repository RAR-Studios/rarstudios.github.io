<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAR Studios — Collection</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo"><img src="icons/logowhitenobackground.png" alt="RAR Studios Logo"></div>
      <div class="logo-tagline"><span>Handmade jewellery</span><span>Based in Barcelona</span></div>
    </div>
    <!-- NAV -->
  </header>

  <main class="frosty-container page-top">
    <section id="gallery" class="gallery">
      <h2>Gallery</h2>
      <div class="gallery-grid">
        <img src="images/perl_white.jpg" alt="Gallery piece">
        <img src="images/perl_black.jpg" alt="Gallery piece">
      </div>
    </section>

    <section id="sami" class="gallery">
      <h2>Sámi Collection</h2>
      <div class="gallery-grid">
        <img src="images/samipin.jpg" alt="Sámi piece">
        <img src="images/samiring.jpg" alt="Sámi piece">
        <img src="images/samiearring.jpg" alt="Sámi piece">
      </div>
    </section>
  </main>
</body>
</html>
