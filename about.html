<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAR Studios — About</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo"><img src="icons/logowhitenobackground.png" alt="RAR Studios Logo"></div>
      <div class="logo-tagline"><span>Handmade jewellery</span><span>Based in Barcelona</span></div>
    </div>
    <!-- NAV -->
  </header>

  <main class="frosty-container page-top">
    <section id="about" class="about">
      <div class="about-container">
        <div class="about-image"><img src="images/selfie 1.jpg" alt="About RAR Studios"></div>
        <div class="about-text">
          <h2>About</h2>
          <p>I’m a Norwegian goldsmith based in Barcelona with a background in glassblowing and contemporary craft.</p>
          <p>Services include repairs &amp; polishing, custom commissions and a curated selection of ready pieces.</p>
        </div>
      </div>
    </section>

    <section id="contact" class="contact">
      <h2>Contact</h2>
      <div class="contact-icons">
        <a class="icon-box" href="https://www.facebook.com/profile.php?id=61578029379720" target="_blank" rel="noopener"><img src="icons/FB.png" alt="Facebook"></a>
        <a class="icon-box" href="https://www.instagram.com/rar.studiosig/" target="_blank" rel="noopener"><img src="icons/IG.png" alt="Instagram"></a>
        <a class="icon-box" href="https://ig.me/m/rar.studiosig" target="_blank" rel="noopener"><img src="icons/IG.png" alt="Instagram DM"></a>
        <a class="icon-box" href="mailto:info@rarstudios.com"><img src="icons/mail.png" alt="Email"></a>
      </div>
    </section>
  </main>
</body>
</html>
